<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>myFlightSim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: #101418; overflow: hidden; }
    /* Trunk appends the Bevy canvas to <body>; it covers this once running. */
    #boot {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      color: #8fa3b8; font: 14px/1.6 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div id="boot">
    Loading myFlightSim — the hangar models stream in over the network.
    <br />
    <a href="CREDITS.md" style="color:#5f7fa0">Credits &amp; license</a>
  </div>
  <!-- Trunk hooks: build the crate to wasm, and copy the runtime assets
       (models/shaders/fonts the app fetches by path at run time). `wasm-opt -Oz`
       is what keeps the release bundle from being tens of megabytes larger;
       the attribution files ride along so the published site is self-contained. -->
  <link data-trunk rel="rust" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue" />
  <link data-trunk rel="copy-dir" href="assets" />
  <link data-trunk rel="copy-file" href="CREDITS.md" />
  <link data-trunk rel="copy-file" href="LICENSE" />
  <script>
    // Web Audio autoplay policy: browsers keep an AudioContext created before
    // any user gesture in the "suspended" state, and only a resume() call made
    // from a gesture handler can start it. Bevy's audio backend (cpal) creates
    // its context once at startup and calls resume() there — outside a gesture
    // — so the context would stay suspended for the whole session and the game
    // would be silent. Wrap the constructor to remember every context the page
    // creates, then resume them all on the first pointer/key gesture (with a
    // few retries, since some browsers grant the activation slightly later).
    (() => {
      const NativeAC = window.AudioContext || window.webkitAudioContext;
      if (!NativeAC) return;
      const contexts = [];
      const Patched = function (...args) {
        const ctx = new NativeAC(...args);
        contexts.push(ctx);
        return ctx;
      };
      Patched.prototype = NativeAC.prototype;
      window.AudioContext = Patched;
      if (window.webkitAudioContext) window.webkitAudioContext = Patched;

      const resumeAll = () => {
        for (const ctx of contexts) {
          if (ctx.state === 'suspended') ctx.resume().catch(() => {});
        }
      };
      const gestures = ['pointerdown', 'pointerup', 'mousedown', 'keydown', 'touchstart'];
      const onGesture = () => {
        resumeAll();
        let tries = 0;
        const id = setInterval(() => {
          resumeAll();
          if (++tries > 10 || contexts.every((ctx) => ctx.state === 'running')) {
            clearInterval(id);
          }
        }, 100);
        for (const e of gestures) window.removeEventListener(e, onGesture, true);
      };
      for (const e of gestures) window.addEventListener(e, onGesture, true);
    })();

    // The app runs on a canvas Trunk appends to <body>; once it appears the
    // boot line has served its purpose and only ghosts through translucent UI.
    new MutationObserver((_, obs) => {
      const canvas = document.querySelector('canvas');
      if (canvas) {
        obs.disconnect();
        const boot = document.getElementById('boot');
        if (boot) boot.remove();
      }
    }).observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
