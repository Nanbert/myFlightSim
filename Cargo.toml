[package]
name = "my_flight_sim"
version = "0.1.0"
edition = "2021"

# The 20+ `*_shot.rs` screenshot/calibration harnesses are look-dev tools with
# no assertions; building every ~2 GB example binary on each `cargo test` made
# test runs crawl (and the machine thrash). They are therefore declared below
# gated behind the `shots` feature: `cargo test` skips them entirely, while
# `cargo run --features shots --example <name>` builds exactly the one you
# want, still resolving explicitly.
autoexamples = false

[features]
# Web builds pass `--no-default-features`: libJSBSim is C++ and cannot link
# into wasm, while the pure-Rust `fdm` engine is the default backend anyway.
default = ["jsbsim"]
shots = []
jsbsim = ["dep:jsbsim-sys"]

[dependencies]
# Both are load-bearing even though no asset *file* needs them: the 737 and
# AH-64D glbs embed JPEG textures, and the missile warning tone in `combat.rs`
# is synthesized as WAV bytes — both decoders live behind these features.
bevy = { version = "0.20", features = ["wav", "jpeg"] }
fdm = { path = "crates/fdm" }
flight-model = { path = "crates/flight-model" }
jsbsim-sys = { path = "jsbsim-sys", optional = true }

# Web persistence: the config/ledger stores write through `localStorage`
# (see `config.rs`). The desktop build needs nothing platform-specific.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[workspace]
members = ["jsbsim-sys", "crates/flight-model", "crates/fdm"]

# JSBSim itself is prebuilt in Release via build.rs; keep our own code fast to
# compile while dependencies (bevy, ...) are optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Look-dev harnesses on demand (see autoexamples above).
[[example]]
name = "ah64_cockpit_shot"
path = "examples/ah64_cockpit_shot.rs"
required-features = ["shots"]
test = false
doc = false

